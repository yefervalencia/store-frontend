<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="custom-card p-4 mt-4">
      <h3 class="text-primary-blue mb-4">Registrar Nuevo Producto</h3>
      
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Nombre del Producto</label>
            <input type="text" class="form-control" formControlName="name">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Precio ($)</label>
            <input type="number" class="form-control" formControlName="price">
          </div>
        </div>
        
        <div class="row">
          <div class="col-md-6 mb-4">
            <label class="form-label fw-bold">Tienda Asociada</label>
            <select class="form-select" formControlName="storeId">
              <option value="" disabled selected>Seleccione una tienda...</option>
              @for (store of stores(); track store.id) {
                <option [value]="store.id">{{ store.name }}</option>
              }
            </select>
          </div>
          <div class="col-md-6 mb-4">
            <label class="form-label fw-bold">Categoría</label>
            <select class="form-select" formControlName="categoryId">
              <option value="" disabled selected>Seleccione una categoría...</option>
              @for (category of categories(); track category.id) {
                <option [value]="category.id">{{ category.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-light" routerLink="/products">Cancelar</button>
          <button type="submit" class="btn btn-primary-custom" [disabled]="productForm.invalid">Guardar Producto</button>
        </div>
      </form>
    </div>
  </div>
</div>
