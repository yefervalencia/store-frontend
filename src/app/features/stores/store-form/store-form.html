<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="custom-card p-4 mt-4">
      <h3 class="text-primary-blue mb-4">Nueva Tienda</h3>
      
      <form [formGroup]="storeForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label class="form-label fw-bold">Nombre de la Tienda</label>
          <input type="text" class="form-control" formControlName="name" placeholder="Ej: Tech Store Centro">
        </div>
        
        <div class="mb-4">
          <label class="form-label fw-bold">Dirección</label>
          <input type="text" class="form-control" formControlName="address" placeholder="Ej: Avenida Principal 123">
        </div>

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn btn-light" routerLink="/stores">Cancelar</button>
          <button type="submit" class="btn btn-primary-custom" [disabled]="storeForm.invalid">Guardar Tienda</button>
        </div>
      </form>
    </div>
  </div>
</div>
