<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="text-primary-blue fw-bold"><i class="bi bi-box-seam"></i> Catálogo de Productos</h2>
  <button class="btn btn-primary-custom px-4" routerLink="/products/new">
    + Nuevo Producto
  </button>
</div>
<div class="row mb-3">
  <div class="col-md-6">
    <div class="input-group shadow-sm">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-medium-gray"></i></span>
      <input type="text" class="form-control border-start-0" placeholder="Buscar por nombre del producto..." 
             [formControl]="searchControl">
    </div>
  </div>
</div>
<div class="custom-card p-4 mt-3">
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th scope="col" class="text-medium-gray">Producto</th>
          <th scope="col" class="text-medium-gray">Precio</th>
          <th scope="col" class="text-medium-gray">Categoría</th>
          <th scope="col" class="text-medium-gray">Tienda Asociada</th>
          <th scope="col" class="text-end text-medium-gray">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (product of products(); track product.id) {
          <tr>
            <td class="fw-semibold text-dark">{{ product.name }}</td>
            <td class="text-success fw-bold">${{ product.price }}</td>
            <td><span class="badge bg-secondary">{{ product.categoryName }}</span></td>
            <td><i class="bi bi-shop me-1 text-primary-blue"></i> {{ product.storeName }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2" [routerLink]="['/products/edit', product.id]">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteProduct(product.id!)">Eliminar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="text-center py-4 text-muted">
              No hay productos registrados en el catálogo.
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
