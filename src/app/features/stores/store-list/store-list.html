<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="text-primary-blue fw-bold"><i class="bi bi-shop-window"></i> Gestión de Tiendas</h2>
  <button class="btn btn-primary-custom px-4" routerLink="/stores/new">
    + Nueva Tienda
  </button>
</div>

<div class="custom-card p-4">
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th scope="col" class="text-medium-gray">Nombre de la Tienda</th>
          <th scope="col" class="text-medium-gray">Dirección</th>
          <th scope="col" class="text-end text-medium-gray">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (store of stores(); track store.id) {
          <tr>
            <td class="fw-semibold text-dark">{{ store.name }}</td>
            <td>{{ store.address }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2" [routerLink]="['/stores/edit', store.id]">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteStore(store.id!)">Eliminar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="text-center py-4 text-muted">
              No hay tiendas registradas aún. ¡Agrega una nueva!
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
