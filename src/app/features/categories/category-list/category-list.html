<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="text-primary-blue fw-bold"><i class="bi bi-tags"></i> Gestión de Categorías</h2>
  <button class="btn btn-primary-custom px-4" routerLink="/categories/new">
    + Nueva Categoría
  </button>
</div>

<div class="row mb-3">
  <div class="col-md-6">
    <div class="input-group shadow-sm">
      <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-medium-gray"></i></span>
      <input type="text" class="form-control border-start-0" placeholder="Buscar categoría..." 
             [formControl]="searchControl">
    </div>
  </div>
</div>

<div class="custom-card p-4 mt-3">
  <div class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th scope="col" class="text-medium-gray">Nombre</th>
          <th scope="col" class="text-medium-gray">Descripción</th>
          <th scope="col" class="text-end text-medium-gray">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (cat of categories(); track cat.id) {
          <tr>
            <td class="fw-semibold text-dark">{{ cat.name }}</td>
            <td>{{ cat.description }}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-secondary me-2" [routerLink]="['/categories/edit', cat.id]">Editar</button>
              <button class="btn btn-sm btn-outline-danger" (click)="deleteCategory(cat.id!)">Eliminar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="text-center py-4 text-muted">No hay categorías registradas.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
